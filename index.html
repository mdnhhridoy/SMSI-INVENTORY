<header><div class="wr"><div class="br"><div class="lg">⚓</div><div><b>SMSI INVENTORY</b><small>মালামালের হিসাব খাতা</small></div><div class="sp"></div><div class="hb" id="hb"></div></div><nav id="nv"></nav></div></header>

<script>
const $=s=>document.querySelector(s),bn=n=>new Intl.NumberFormat('bn-BD',{maximumFractionDigits:2}).format(+n||0),tk=n=>'৳'+new Intl.NumberFormat('bn-BD',{maximumFractionDigits:0}).format(+n||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Dhaka'}).format(new Date());
const fd=d=>{const[y,m,x]=d.split('-').map(Number);return new Intl.DateTimeFormat('bn-BD',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,m-1,x)))};
const fm=m=>{const[y,x]=m.split('-').map(Number);return new Intl.DateTimeFormat('bn-BD',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(Date.UTC(y,x-1,1)))};
const shift=(m,d)=>{const[y,x]=m.split('-').map(Number),t=y*12+x-1+d;return`${Math.floor(t/12)}-${String(t%12+1).padStart(2,'0')}`};
const TL={p:'কেনা',i:'দেওয়া',r:'ফেরত'},TC={p:'#2a9d6f',i:'#1f4d8f',r:'#e8a317'},PT={v:'মাদার ভেসেল',g:'ঘাট',o:'অন্যান্য'};
const K='smsi_inv_v1',seed=()=>({v:1,upd:0,seq:10,items:[],places:[],moves:[],log:[]});
let S=seed(),tab='h',F={m:today().slice(0,7),t:'',all:0};
const live=()=>S.moves.filter(m=>!m.del),it=id=>S.items.find(x=>x.id==id),pl=id=>S.places.find(x=>x.id==id);
const stock=(id,ms=live())=>ms.reduce((a,m)=>m.item==id?a+(m.t=='i'?-m.qty:m.qty):a,0);
const net=(id,p,ms=live())=>ms.reduce((a,m)=>m.item==id&&m.place==p?a+(m.t=='i'?m.qty:m.t=='r'?-m.qty:0):a,0);
function check(ms){const L=ms.filter(m=>!m.del);for(const x of S.items){const s=stock(x.id,L);if(s<-1e-9)return`${x.name} এর স্টক মাইনাস হয়ে যাবে (${bn(s)})। স্টকের চেয়ে বেশি দেওয়া যাবে না`}for(const x of S.items)for(const p of S.places){if(net(x.id,p.id,L)<-1e-9)return`${p.name} থেকে ${x.name} যত দেওয়া হয়েছে তার চেয়ে বেশি ফেরত হচ্ছে`}return''}
function toast(t,fn,lb){const e=$('#ts');e.style.display='flex';e.innerHTML=esc(t)+(fn?`<button id="tb">${lb}</button>`:'');if(fn)$('#tb').onclick=()=>{fn();e.style.display='none'};clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.display='none',fn?7000:3000)}
/* ===== ডাটা সুরক্ষা: ডিভাইসে দুই জায়গা + দৈনিক স্ন্যাপশট + ফাইল/শেয়ার ব্যাকআপ ===== */
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const idb=(m,v)=>new Promise(r=>{try{const q=indexedDB.open('smsi',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>{const o=q.result.transaction('k',m=='get'?'readonly':'readwrite').objectStore('k'),x=m=='get'?o.get('s'):o.put(v,'s');x.onsuccess=()=>r(x.result);x.onerror=()=>r()};q.onerror=()=>r()}catch(e){r()}});
function persist(){const j=JSON.stringify(S);ls(K,j);idb('put',j);const d=today(),sn=JSON.parse(ls('smsi_snaps')||'{}');if(!sn[d]||Date.now()-sn[d].at>36e5){sn[d]={at:Date.now(),j};Object.keys(sn).sort().slice(0,-10).forEach(k=>delete sn[k]);ls('smsi_snaps',JSON.stringify(sn))}}
function save(msg){S.upd=Date.now();if(msg){S.log.unshift({t:Date.now(),m:msg});S.log.length=Math.min(S.log.length,60)}persist();ghSched();render()}
async function boot(){let c=[];try{c.push(JSON.parse(ls(K)))}catch(e){}try{c.push(JSON.parse(await idb('get')))}catch(e){}c=c.filter(x=>x&&x.items);if(c.length)S=c.sort((a,b)=>b.upd-a.upd)[0];try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}render();ghBoot()}
const bdays=()=>{const l=+ls('smsi_dl')||0;return l?Math.floor((Date.now()-l)/864e5):null};
function backupFile(){const j=JSON.stringify(S,null,1),n='smsi-backup-'+today()+'.json';try{const f=new File([j],n,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:n}).then(()=>ls('smsi_dl',String(Date.now()))).then(render).catch(()=>{});return}}catch(e){}const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:'application/json'}));a.download=n;a.click();ls('smsi_dl',String(Date.now()));render()}
function dlText(n,t,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click()}
/* ===== সাধারণ UI ===== */
function modal(h){$('#ov').innerHTML=`<div class="ov" onclick="if(event.target==this)closeM()"><div class="md">${h}</div></div>`}function closeM(){$('#ov').innerHTML=''}
function ask(msg,fn,lbl='হ্যাঁ'){window._f=fn;modal(`<p>${msg}</p><div class="fl"><button onclick="closeM()">না</button><button class="pr" style="background:var(--rd);border-color:var(--rd)" onclick="closeM();_f()">${lbl}</button></div>`)}
function go(t){tab=t;D=null;render();scrollTo(0,0)}
function render(){$('#nv').innerHTML=[['h','📊 ড্যাশবোর্ড'],['k','📒 খাতা'],['a','⚙️ আরও']].map(([k,v])=>`<button class="${tab==k?'on':''}" onclick="go('${k}')">${v}</button>`).join('');$('#fb').innerHTML=tab=='h'&&!D?'':(FO?['p','i','r'].map(t=>`<button style="background:${TC[t]}" onclick="FO=0;mv('${t}')">+ ${TL[t]}</button>`).join(''):'')+`<button class="fm" onclick="FO=!FO;render()">${FO?'✕ বন্ধ':'＋ নতুন এন্ট্রি'}</button>`;const b=bdays();$('#hb').textContent=GH()?(ghs=='err'?'⚠ ক্লাউড সমস্যা':ghs=='ok'?'☁ ক্লাউডে সেভ ✓':'☁ সেভ হচ্ছে…'):(b!=null&&b<7?'✓ ব্যাকআপ নেওয়া আছে':'⚠ ব্যাকআপ নিন');$('#hb').onclick=()=>go('a');$('#mn').innerHTML=D?vDet():{h:vH,k:vK,a:vA}[tab]()}
function mrow(m,ed=1){const x=it(m.item)||{name:'?',unit:''},p=pl(m.place),a=m.t=='p'&&m.price!=null?(m.amt!=null?m.amt:m.price*m.qty):null;return`<div class="row" style="border-left:4px solid ${TC[m.t]};padding-left:10px"><span class="bd ${m.t}">${TL[m.t]}</span><div class="m"><b>${esc(x.name)}</b>${p?` → <b>${esc(p.name)}</b> <span class="mu">(${PT[p.type]})</span>`:''}<br><span class="mu">📅 ${fd(m.date)}${m.party?' • '+(m.t=='p'?'🏪 দোকান: ':m.t=='i'?'👤 যাকে দিয়েছি: ':'👤 ফেরত দিয়েছেন: ')+esc(m.party):''}${m.note?' • 📝 '+esc(m.note):''}</span></div><b>${m.t=='i'?'−':'+'}${bn(m.qty)} ${esc(x.unit)}</b>${a!=null?`<span class="bd p">${tk(a)}</span>`:''}${ed?`<span><button class="ic" onclick="mv('${m.t}',${m.id})">✎</button> <button class="ic dn" onclick="delM(${m.id})">🗑</button></span>`:''}</div>`}
function sum(mo){const a=mo+'-01',e=shift(mo,1)+'-01',L=live();return S.items.map(x=>{const f=L.filter(v=>v.item==x.id),o=f.filter(v=>v.date<a).reduce((s,v)=>s+(v.t=='i'?-v.qty:v.qty),0),g=t=>f.filter(v=>v.t==t&&v.date>=a&&v.date<e),Q=t=>g(t).reduce((s,v)=>s+v.qty,0);return{x,o,p:Q('p'),i:Q('i'),r:Q('r'),c:g('p').reduce((s,v)=>s+v.qty*(v.price||0),0)}})}
const cl=s=>s.o+s.p-s.i+s.r;
function age(x,p){const I=live().filter(m=>m.item==x&&m.place==p&&m.t=='i').sort((a,b)=>a.date.localeCompare(b.date));let R=live().filter(m=>m.item==x&&m.place==p&&m.t=='r').reduce((s,m)=>s+m.qty,0);for(const m of I){if(m.qty>R+1e-9)return Math.floor((Date.now()-new Date(m.date+'T00:00:00Z'))/864e5);R-=m.qty}return 0}
function vH(){const L=live(),td=today(),mo=td.slice(0,7),since=new Date(Date.now()-30*864e5).toISOString().slice(0,10),sm=sum(mo),low=S.items.filter(x=>stock(x.id)<=x.min),b=bdays(),nt=L.filter(m=>m.date==td).length,Lm=L.filter(m=>m.date.startsWith(mo));
const pb=S.places.map(p=>{const v=S.items.map(x=>({x,n:Lm.filter(m=>m.place==p.id&&m.item==x.id).reduce((a,m)=>a+(m.t=='i'?m.qty:m.t=='r'?-m.qty:0),0)})).filter(o=>o.n>0);return{p,v,t:v.reduce((a,o)=>a+o.n,0)}}).filter(o=>o.t>0).sort((a,b)=>b.t-a.t),mx1=Math.max(1,...pb.map(o=>o.t));

const dec=b=>decodeURIComponent(escape(atob(b.replace(/\n/g,''))));
async function ghGet(g){const r=await fetch(ghu(g),{headers:ghH(g),cache:'no-store'});if(r.status==404)return null;if(!r.ok)throw new Error(r.status==401?'টোকেন ভুল বা মেয়াদ শেষ':r.status==403?'অনুমতি নেই':'সংযোগ সমস্যা ('+r.status+')');return r.json()}
async function ghPush(){const g=GH();if(!g||!g.tok)return;ghs='…';render();try{const o=await ghGet(g),r=await fetch(ghu(g),{method:'PUT',headers:{...ghH(g),'Content-Type':'application/json'},body:JSON.stringify({message:'SMSI ব্যাকআপ '+new Date().toISOString(),content:btoa(unescape(encodeURIComponent(JSON.stringify(S,null,1)))),...(o?{sha:o.sha}:{})})});if(!r.ok)throw new Error(r.status==404?'রিপোজিটরি পাওয়া যায়নি (নাম বা README দেখুন)':r.status==401?'টোকেন ভুল বা মেয়াদ শেষ':r.status==403||r.status==422?'অনুমতি নেই — টোকেনে Contents: Read and write দিন':'সেভ হয়নি ('+r.status+')');ghs='ok';ght=Date.now()}catch(e){ghs='err';ghe=e.message||'ইন্টারনেট সমস্যা'}render()}
function ghSched(){if(!GH())return;ghs='…';clearTimeout(ghh);ghh=setTimeout(ghPush,3000)}
function ghSave(){const repo=$('#gr').value.trim().replace(/^https?:\/\/github\.com\//,'').replace(/\/$/,''),tok=$('#gt').value.trim();if(!/^[\w.-]+\/[\w.-]+$/.test(repo)||!tok)return toast('রিপোজিটরি (ইউজারনেম/নাম) ও টোকেন দিন');ls('smsi_gh',JSON.stringify({repo,tok}));ghPush()}
function ghOff(){ask('GitHub ব্যাকআপ বন্ধ করবেন? (GitHub-এর ফাইল মুছবে না)',()=>{ls('smsi_gh','');ghs='';render()},'বন্ধ করুন')}
async function ghPull(){const g=GH();try{const o=await ghGet(g);if(!o||!o.content)return toast('GitHub-এ ডাটা পাওয়া যায়নি');useData(JSON.parse(dec(o.content)),'GitHub-এর ডাটা আসবে।')}catch(e){toast('⚠ '+e.message)}}
async function ghBoot(){const g=GH();if(!g||!g.tok)return;try{const o=await ghGet(g);if(!o||!o.content)return ghPush();const x=JSON.parse(dec(o.content));if(x.upd>S.upd){ls('smsi_pre',JSON.stringify(S));S=Object.assign(seed(),x);persist();ghs='ok';ght=Date.now();render();toast('GitHub-এর নতুন ডাটা এসেছে ✓')}else if(x.upd<S.upd)ghPush();else{ghs='ok';ght=Date.now();render()}}catch(e){ghs='err';ghe=e.message||'ইন্টারনেট সমস্যা';render()}}
function ghCard(){const g=GH()||{};return`<div class="c"><h3>☁ GitHub ক্লাউড ব্যাকআপ ${g.tok?'<span class="bd p">চালু</span>':''}</h3><span class="mu">প্রতিটি এন্ট্রির পর নিজে থেকে আপনার private GitHub রিপোজিটরিতে সেভ হবে। প্রতিবারের ইতিহাসও GitHub-এ থাকে। অন্য ফোনে একই রিপোজিটরি ও টোকেন দিলে একই ডাটা আসবে।</span><label>রিপোজিটরি (ইউজারনেম/রিপোর-নাম)</label><input id="gr" placeholder="আপনার-ইউজারনেম/smsi-data" value="${esc(g.repo||'')}"><label>টোকেন (Personal Access Token)</label><input id="gt" type="password" value="${esc(g.tok||'')}"><div class="fl" style="margin-top:10px"><button class="pr" onclick="ghSave()">সেভ ও এখনই ব্যাকআপ</button>${g.tok?'<button onclick="ghPull()">⬇ GitHub থেকে ফিরিয়ে আনুন</button><button class="dn" onclick="ghOff()">বন্ধ করুন</button>':''}</div><p class="mu">${ghs=='ok'?'✓ শেষ সেভ: '+new Date(ght).toLocaleString('bn-BD'):ghs=='err'?'⚠ '+esc(ghe):ghs=='…'?'সেভ হচ্ছে…':''}</p></div>`}
function grpCards(Lm){const Q=window._q=[],A=t=>{const o={};Lm.filter(m=>m.t==t&&m.party).forEach(m=>{const a=o[m.party]||(o[m.party]={q:0,a:0,n:0});a.q+=m.qty;a.a+=m.t=='p'?(m.amt??(m.price||0)*m.qty):0;a.n++});return Object.entries(o).sort((x,y)=>y[1].q-x[1].q)},row=(n,v,t)=>`<div class="row tap" onclick="det('q',_q[${Q.push(n)-1}])"><div class="m"><b>${esc(n)} ›</b><br><span class="mu">${bn(v.n)}টি এন্ট্রি</span></div><b>${bn(v.q)} কেজি</b>${t=='p'?`<span class="bd p">${tk(v.a)}</span>`:''}</div>`,P=A('p'),I=A('i');return`<div class="sg2"><div class="c"><h3>🏪 দোকান অনুযায়ী কেনা (এ মাসে)</h3>${P.map(([n,v])=>row(n,v,'p')).join('')||'<p class="mu">এ মাসে কেনা নেই।</p>'}</div><div class="c"><h3>👤 কাকে কত দেওয়া হয়েছে (এ মাসে)</h3>${I.map(([n,v])=>row(n,v,'i')).join('')||'<p class="mu">এ মাসে দেওয়া নেই।</p>'}</div></div>`}
const names=g=>{const o={};S.moves.filter(m=>(g=='s')==(m.t=='p')&&m.party).forEach(m=>{const a=o[m.party]||(o[m.party]={n:0});if(!m.del)a.n++});return Object.entries(o).sort((a,b)=>b[1].n-a[1].n)};
function nmCard(){const q=(Aq||'').toLowerCase(),W=window._nm=[],blk=(g,t)=>{const L=names(g).filter(([n])=>!q||n.toLowerCase().includes(q));return`<div class="c"><h3>${t}</h3><span class="mu">বানান ভুল হলে ✎ দিয়ে ঠিক করুন। একই নাম দুইবার থাকলে একটার নাম অন্যটার মতো করে দিলেই মিলে যাবে।</span>${L.map(([n,v])=>`<div class="row"><div class="m"><b>${esc(n)}</b><br><span class="mu">${bn(v.n)}টি এন্ট্রি</span></div><button class="ic" onclick="rn('${g}',_nm[${W.push(n)-1}])">✎</button><button class="ic dn" onclick="dn('${g}',_nm[${W.length-1}])">🗑</button></div>`).join('')||'<p class="mu">কোনো নাম নেই।</p>'}</div>`};return blk('s','🏪 দোকানের নামের তালিকা')+blk('p','👤 ব্যক্তির নামের তালিকা (যাকে দেওয়া / যে ফেরত দিয়েছে)')}
function rn(g,old){window._on=old;window._og=g;modal(`<h3>নাম সংশোধন</h3><p class="mu">এই নামের সব এন্ট্রিতে নতুন নাম বসে যাবে। আগে থেকে থাকা অন্য নাম লিখলে দুটো মিলে এক হয়ে যাবে।</p><label>সঠিক নাম</label><input id="nn" list="nl" value="${esc(old)}"><datalist id="nl">${names(g).map(([n])=>`<option value="${esc(n)}">`).join('')}</datalist><br><div class="fl"><button onclick="closeM()">বাতিল</button><button class="pr" onclick="doRn()">সেভ</button></div>`)}
function doRn(){const nw=$('#nn').value.trim(),old=_on,g=_og;if(!nw)return toast('নাম লিখুন');if(nw==old)return closeM();const mrg=names(g).some(([n])=>n==nw);S.moves=S.moves.map(m=>m.party==old&&(g=='s')==(m.t=='p')?{...m,party:nw}:m);if(D&&D.k=='q'&&D.id==old)D.id=nw;closeM();save(`নাম সংশোধন: ${old} → ${nw}`);toast(mrg?'নামটি আগের নামের সাথে মিলে গেছে ✓':'নাম ঠিক হয়েছে ✓')}
function dn(g,name){window._on=name;window._og=g;const n=S.moves.filter(m=>m.party==name&&(g=='s')==(m.t=='p')&&!m.del).length;modal(`<h3>“${esc(name)}” মুছবেন?</h3><p>এই নামে ${bn(n)}টি এন্ট্রি আছে। <b>বানান ভুল হলে মুছবেন না</b>, ✎ দিয়ে ঠিক করুন।</p><div class="fl" style="flex-direction:column"><button onclick="doDn(0)">শুধু নামটা মুছুন (এন্ট্রি থাকবে, নাম ফাঁকা হবে)</button><button class="dn" onclick="doDn(1)">নামসহ সব এন্ট্রি ট্র্যাশে পাঠান</button><button onclick="closeM()">বাতিল</button></div>`)}
function doDn(all){const old=_on,g=_og,ok=m=>m.party==old&&(g=='s')==(m.t=='p'),ms=S.moves.map(m=>ok(m)?(all?{...m,del:m.del||Date.now()}:{...m,party:''}):m);if(all){const er=check(ms);if(er)return toast('⛔ '+er)}S.moves=ms;D=null;closeM();save('নাম মোছা: '+old)}
function mg(k,id){const x=k=='x'?it(id):pl(id),O=(k=='x'?S.items:S.places).filter(o=>o.id!=id),n=S.moves.filter(m=>(k=='x'?m.item:m.place)==id).length;modal(`<h3>“${esc(x.name)}” মুছবেন?</h3><p>এর ${bn(n)}টি এন্ট্রি আছে। <b>বানান ভুল হলে মুছবেন না</b>, ✎ দিয়ে নাম ঠিক করুন। একই জিনিস দুইবার থাকলে নিচে বেছে মিলিয়ে দিন।</p>${O.length?`<label>এর এন্ট্রিগুলো যার সাথে মিলবে</label><select id="mt">${O.map(o=>`<option value="${o.id}">${esc(o.name)}</option>`).join('')}</select><button class="pr" style="margin-top:8px;width:100%" onclick="doMg('${k}',${id})">মিলিয়ে দিন ও এটি মুছুন</button>`:''}<div class="fl" style="margin-top:8px"><button onclick="closeM()">বাতিল</button><button onclick="closeM();${k=='x'?'xf':'pf'}(${id})">✎ নাম ঠিক করুন</button></div>`)}
function doMg(k,id){const t=+$('#mt').value,f=k=='x'?'item':'place',ms=S.moves.map(m=>m[f]==id?{...m,[f]:t}:m),er=check(ms);if(er)return toast('⛔ '+er);S.moves=ms;if(k=='x')S.items=S.items.filter(o=>o.id!=id);else S.places=S.places.filter(o=>o.id!=id);D=null;closeM();save('মিলিয়ে দেওয়া');toast('মিলিয়ে দেওয়া হয়েছে ✓')}
boot();
</script></body></html>
